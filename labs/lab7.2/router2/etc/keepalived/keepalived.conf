vrrp_instance VI_1 {
    state BACKUP
    interface eth0              # Vlaned interface
    track_interface {           # Interface state we monitor
      eth0
      eth1
    }
    virtual_router_id 51
    priority 99
    virtual_ipaddress {
        192.168.1.1 
    }
    virtual_routes {
        default gw 60.1.1.2
    }
}


